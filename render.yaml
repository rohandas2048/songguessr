# Render Blueprint — a free Node web service.
#
# The free plan sleeps after ~15 minutes of inactivity. This app keeps sessions,
# contexts and rounds in process memory, so a sleep logs everyone out and strands
# any loaded playlist. The UI handles that: a stranded round says so and offers
# "start over". Featured playlists reload instantly, since they are read from disk.
#
# Deploy: push this repo to GitHub, then New > Blueprint on render.com and point
# it at the repo. Everything below is applied automatically except the two values
# marked sync: false, which are entered once in the dashboard.

services:
  - type: web
    name: songguessr
    runtime: node
    plan: free
    region: oregon

    # --include=dev is required: Render sets NODE_ENV=production, which would
    # otherwise make npm skip the devDependencies that tsc and vite live in.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start

    healthCheckPath: /healthz

    envVars:
      # Signs the session cookie. Generated once and kept across deploys;
      # changing it logs everyone out.
      - key: SESSION_SECRET
        generateValue: true

      # Loopback is unreachable from outside the container.
      - key: HOST
        value: 0.0.0.0

      # Render terminates TLS in front of the app, so per-IP rate limiting must
      # read the forwarded address rather than the proxy's.
      - key: TRUST_PROXY
        value: "1"

      # APP_URL and SPOTIFY_REDIRECT_URI are deliberately absent. Render assigns the
      # real hostname (songguessr-7s7h.onrender.com, say, not the service name), and a
      # guess written here would break the Spotify login: the session cookie is scoped
      # by hostname, so the OAuth round trip would return somewhere the cookie is not
      # sent. The app reads Render's own RENDER_EXTERNAL_URL instead. Set APP_URL only
      # to override that, such as behind a custom domain.

      # Set in the dashboard, never in the repo. Without them the app still runs:
      # genre, artist, album and featured modes do not need Spotify.
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false

      # Unlocks adding and removing featured playlists. Leave it unset to make the
      # featured list read-only here and author it locally instead — which is the
      # durable option, since this plan has no persistent disk: a playlist saved on
      # the running service is lost at the next deploy or wake-up, while one committed
      # to data/presets/ ships with the image.
      - key: CURATOR_PASSWORD
        sync: false
